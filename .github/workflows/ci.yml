name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (hidapi)
        run: |
          sudo apt-get update
          sudo apt-get install -y libhidapi-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest typer rich hidapi

      - name: Install dac-peq-manager
        run: |
          pip install -e dac-peq-manager/

      - name: Run test suite
        run: |
          pytest dac-peq-manager/tests -v

  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install system dependencies (libudev)
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev
      - name: Cargo test dac-peq-core
        run: |
          cargo test --manifest-path dac-peq-manager/Cargo.toml -p dac-peq-core
      - name: Cargo build dac-peq-cli
        run: |
          cargo build --manifest-path dac-peq-manager/Cargo.toml --release -p dac-peq-cli
