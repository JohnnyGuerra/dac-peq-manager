name: Release Standalone Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.0)'
        required: true
        default: 'v0.2.0'

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: dac-peq
            asset_name: dac-peq-linux-x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: dac-peq.exe
            asset_name: dac-peq-windows-x86_64.exe
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: dac-peq
            asset_name: dac-peq-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: dac-peq
            asset_name: dac-peq-macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev

      - name: Build release binary
        run: |
          cargo build --manifest-path dac-peq-manager/Cargo.toml --release --target ${{ matrix.target }} -p dac-peq-cli

      - name: Stage asset (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cp dac-peq-manager/target/${{ matrix.target }}/release/${{ matrix.artifact_name }} ./${{ matrix.asset_name }}
          chmod +x ./${{ matrix.asset_name }}

      - name: Stage asset (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cp dac-peq-manager/target/${{ matrix.target }}/release/${{ matrix.artifact_name }} ./${{ matrix.asset_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  publish-release:
    name: Create GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish Release with Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
